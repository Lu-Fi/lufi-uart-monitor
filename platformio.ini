; ESP32 WiFi UART monitor for the ABUS PPIC90520 (T30 <-> XR871 <-> MCU)
; build:  .venv/bin/pio run
; flash:  .venv/bin/pio run -t upload --upload-port /dev/ttyUSB0
; log:    .venv/bin/pio device monitor -p /dev/ttyUSB0 -b 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; wireless update: UARTMON_PASS = AP password (printed on the USB console)
;   UARTMON_IP=<ip> UARTMON_PASS=... .venv/bin/pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${sysenv.UARTMON_IP}
upload_flags = --auth=${sysenv.UARTMON_PASS}
